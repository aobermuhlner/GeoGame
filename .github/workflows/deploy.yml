name: Deploy frontend to Cloudflare Pages

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'shared/**', 'package.json', 'package-lock.json', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail if the Worker URL or Cloudflare account is missing
        if: ${{ vars.VITE_WORKER_URL == '' || vars.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "::error::Set the repository variables VITE_WORKER_URL and CLOUDFLARE_ACCOUNT_ID (see README → Deploy)"
          exit 1
      - name: Build
        run: npm run build -w frontend
        env:
          # Set under Settings → Secrets and variables → Actions → Variables
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
      - name: Deploy
        run: npx wrangler pages deploy frontend/dist --project-name georivals --branch main --commit-dirty=true
        env:
          # API token with "Cloudflare Pages: Edit" (Settings → Secrets and variables → Actions → Secrets)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
