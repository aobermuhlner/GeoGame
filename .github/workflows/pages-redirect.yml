name: Redirect old GitHub Pages site

# The game moved to Cloudflare Pages. This publishes a stub at https://aobermuhlner.github.io/GeoGame/ that sends
# every old URL (including invite links) to the same path on https://georivals.pages.dev.
on:
  push:
    branches: [main]
    paths: ['.github/pages-redirect/**', '.github/workflows/pages-redirect.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub Pages serves 404.html for every unknown path, so deep links redirect too.
      - run: |
          mkdir site
          cp .github/pages-redirect/index.html site/index.html
          cp .github/pages-redirect/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
