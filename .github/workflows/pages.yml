name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'shared/**', 'package.json', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail if the Worker URL is missing
        if: ${{ vars.VITE_WORKER_URL == '' }}
        run: |
          echo "::error::Repository variable VITE_WORKER_URL is not set (e.g. https://flag-duel.<you>.workers.dev)"
          exit 1
      - name: Build
        run: npm run build -w frontend
        env:
          # Set under Settings → Secrets and variables → Actions → Variables
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
