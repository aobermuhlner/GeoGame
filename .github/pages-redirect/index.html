<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Moved to georivals.pages.dev</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://georivals.pages.dev/" />
    <meta http-equiv="refresh" content="0; url=https://georivals.pages.dev/" />
    <script>
      // Keep the path and query, so old invite links (/GeoGame/?room=CODE) still land in the lobby.
      var path = location.pathname.replace(/^\/GeoGame\/?/, '/');
      location.replace('https://georivals.pages.dev' + path + location.search + location.hash);
    </script>
  </head>
  <body>
    <p>The game has moved to <a href="https://georivals.pages.dev/">georivals.pages.dev</a>.</p>
  </body>
</html>
