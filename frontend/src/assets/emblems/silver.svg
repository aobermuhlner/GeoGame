    </linearGradient>
    <linearGradient id="em-silver-pole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76818c"/><stop offset=".4" stop-color="#ffffff"/><stop offset="1" stop-color="#76818c"/>
    </linearGradient>
    <linearGradient id="em-silver-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#76818c"/><stop offset="1" stop-color="#343d46"/>
    </linearGradient>
    <linearGradient id="em-silver-fold" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".18"/><stop offset=".22" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#000" stop-opacity=".16"/><stop offset=".78" stop-color="#fff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#000" stop-opacity=".14"/>
    </linearGradient>
    <radialGradient id="em-silver-knob" cx=".35" cy=".35" r=".7">
