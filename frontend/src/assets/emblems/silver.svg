<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Silver division">
  <defs>
    <linearGradient id="em-silver-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#c3ccd5"/>
      <stop offset=".7" stop-color="#76818c"/><stop offset="1" stop-color="#c3ccd5"/>
    </linearGradient>
    <linearGradient id="em-silver-cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#c3ccd5"/><stop offset="1" stop-color="#76818c"/>
    </linearGradient>
    <linearGradient id="em-silver-dark" x1="0" y1="0" x2="0" y2="1">
